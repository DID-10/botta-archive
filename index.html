<!DOCTYPE html> <!-- HTML5 시작 -->

<html lang="ko"> <!-- 웹페이지 시작 -->


<head> <!-- 설정 시작 -->


<meta charset="UTF-8">
<!-- 한글 설정 -->


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 모바일 대응 -->


<title>보따 도감</title>
<!-- 페이지 제목 -->


<style>


/* =========================
   기본 설정
========================= */


* {

margin:0;
/* 기본 여백 제거 */

padding:0;
/* 기본 여백 제거 */

box-sizing:border-box;
/* 크기 계산 */

}



body {

font-family:sans-serif;
/* 기본 폰트 */

overflow:hidden;
/* 스크롤 제거 */

}



/* =========================
   페이지 공통
========================= */


.page {


width:100vw;

height:100vh;


display:flex;


justify-content:center;


align-items:center;


flex-direction:column;



}



/* =========================
   첫 번째 페이지
========================= */


.first-page {


background:

linear-gradient(

135deg,

#db4ea7,

#e46fc2

);



}



/* 제목 */


.logo {


font-size:90px;


font-weight:900;


color:white;


}



/* 입장 버튼 */


.enter {


margin-top:80px;


padding:20px 60px;


border-radius:50px;


background:white;


color:#db4ea7;


font-size:25px;


cursor:pointer;


}



/* =========================
   두 번째 페이지
========================= */


.second-page {


background:#fafafa;


display:none;


padding:50px;


justify-content:flex-start;


}



/* 상단 제목 */


.title {


font-size:50px;


font-weight:bold;


margin-bottom:50px;


}



/* =========================
   영상 카드 영역
========================= */


.video-list {


width:100%;


display:grid;


grid-template-columns:

repeat(2,1fr);


gap:40px;


}



/* 카드 */


.card {


height:280px;


border-radius:20px;


background:white;


box-shadow:

0 10px 30px rgba(0,0,0,0.1);


padding:20px;


cursor:pointer;


}



/* 썸네일 공간 */


.thumbnail {


height:160px;


background:#ddd;


border-radius:15px;


display:flex;


justify-content:center;


align-items:center;


font-size:40px;


}



/* 카드 글 */


.card-text {


margin-top:20px;


font-size:20px;


}



</style>


</head>



<body>
<!-- 화면 시작 -->



<section class="page first-page" id="first">
<!-- 첫 페이지 -->


<div class="logo">

보따 도감

</div>



<div class="enter" onclick="openArchive()">

도감 보기

</div>


</section>




<section class="page second-page" id="archive">
<!-- 두 번째 페이지 -->


<div class="title">

보따 영상 도감

</div>



<div class="video-list">



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>




<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>




<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>




<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>



</div>



</section>



<script>


function openArchive(){

/* 첫 화면 숨김 */

document.getElementById("first").style.display="none";


/* 두 번째 화면 표시 */

document.getElementById("archive").style.display="flex";


}



</script>


</body>


</html>
