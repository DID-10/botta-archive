<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow-x:hidden;
    font-family:sans-serif;
}


/* =========================
   1페이지
========================= */

.home{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
    linear-gradient(
        135deg,
        #db4ea7,
        #e46fc2
    );

}


.logo{

    color:white;

    font-size:90px;

    font-weight:900;

    animation:float 3s infinite ease-in-out;

}


.subtitle{

    margin-top:20px;

    color:white;

    font-size:30px;

    font-weight:700;

}


@keyframes float{

    50%{

        transform:translateY(-15px);

    }

}



.arrow{

    margin-top:100px;

    color:white;

    font-size:50px;

}




/* =========================
   2페이지
========================= */


.archive{

    min-height:100vh;

    padding:60px;

    background:#fafafa;

}



.title{

    font-size:55px;

    font-weight:900;

    margin-bottom:50px;

}



.card-list{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:40px;

}



/* 카드 */


.card{

    position:relative;

    background:white;

    border-radius:25px;

    padding:20px;

    cursor:pointer;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.1);

    transition:.3s;

}


.card:hover{

    transform:translateY(-10px);

}



/* 등급 */

.grade{

    position:absolute;

    top:20px;

    right:20px;

    background:#111;

    color:white;

    padding:8px 15px;

    border-radius:20px;

    font-weight:900;

}



/* 짤 이미지 */

.image{

    height:230px;

    background:#ddd;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:70px;

}



/* 짤 이름 */

.name{

    margin-top:20px;

    font-size:25px;

    font-weight:900;

}



/* =========================
상세 페이지
========================= */


.detail{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100vw;

    height:100vh;

    background:white;

    z-index:10;

    padding:60px;

}



.back{

    cursor:pointer;

    font-size:22px;

    margin-bottom:40px;

}



.detail-box{

    display:flex;

    gap:60px;

    align-items:flex-start;

}



.detail-image{

    width:550px;

    height:400px;

    background:#ddd;

    border-radius:30px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:100px;

}



.info{

    font-size:25px;

    line-height:2;

}



.skill{

    margin-top:40px;

    font-size:35px;

    font-weight:900;

}



</style>


</head>



<body>


<!-- 1페이지 -->


<section class="home">


<div class="logo">

보따 도감

</div>


<div class="subtitle">

김원식 짤 카드 도감

</div>


<div class="arrow">

↓

</div>


</section>





<!-- 2페이지 -->


<section class="archive">


<div class="title">

김원식 짤 카드 도감

</div>



<div class="card-list">



<div class="card" onclick="openDetail()">


<div class="grade">

D컵

</div>


<div class="image">

📸

</div>


<div class="name">

레전드 표정

</div>


</div>





<div class="card">


<div class="grade">

C컵

</div>


<div class="image">

📸

</div>


<div class="name">

웃참 실패

</div>


</div>





<div class="card">


<div class="grade">

B컵

</div>


<div class="image">

📸

</div>


<div class="name">

화난 김원식

</div>


</div>



</div>


</section>






<!-- 상세 페이지 -->


<div class="detail" id="detail">


<div class="back" onclick="closeDetail()">

← 돌아가기

</div>



<div class="detail-box">



<div class="detail-image">

📸

</div>



<div class="info">


<h1>

레전드 표정

</h1>


<br>


출처 영상

<br>

등장 시간

<br>



<div class="skill">

조지는 방법

</div>


- 표정 공격

<br>

- 타이밍 공격



<br><br>


등급

<br>

D컵



</div>



</div>


</div>






<script>


history.scrollRestoration="manual";


window.onload=function(){

window.scrollTo(0,0);

}



let y=0;


function openDetail(){

y=window.scrollY;

document.getElementById("detail").style.display="block";

}



function closeDetail(){

document.getElementById("detail").style.display="none";

window.scrollTo(0,y);

}



</script>



</body>

</html>
