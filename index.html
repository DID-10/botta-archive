<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>


<style>


/* =========================
기본 설정
========================= */


* {

margin:0;
padding:0;
box-sizing:border-box;

}



html {

scroll-behavior:smooth;

}



body {

font-family:sans-serif;

overflow-x:hidden;

}



/* =========================
페이지 공통
========================= */


.page {

width:100vw;

min-height:100vh;

display:flex;

flex-direction:column;

align-items:center;

}



/* =========================
1페이지
========================= */


.first-page {

height:100vh;

justify-content:center;


background:

linear-gradient(

135deg,

#db4ea7,

#e46fc2

);

}



.logo {


font-size:90px;


font-weight:900;


color:white;


animation:

floatLogo 3s infinite ease-in-out;


}



@keyframes floatLogo {


0% {

transform:translateY(0);

}


50% {

transform:translateY(-15px);

}


100% {

transform:translateY(0);

}


}



.arrow {


margin-top:100px;


font-size:50px;


color:white;


}



/* =========================
2페이지 영상 도감
========================= */


.second-page {


min-height:100vh;


background:#fafafa;


padding:60px;


justify-content:flex-start;


}



.title {


font-size:55px;


font-weight:900;


margin-bottom:50px;


}



.video-list {


width:100%;


display:grid;


grid-template-columns:repeat(2,1fr);


gap:40px;


}



.card {


height:280px;


background:white;


border-radius:20px;


padding:20px;


cursor:pointer;


box-shadow:


0 10px 30px rgba(0,0,0,0.1);


}



.thumbnail {


height:160px;


background:#ddd;


border-radius:15px;


display:flex;


justify-content:center;


align-items:center;


font-size:40px;


}



.card-text {


margin-top:20px;


font-size:20px;


}



/* =========================
3페이지 상세
========================= */


.detail-page {


min-height:100vh;


background:white;


padding:60px;


justify-content:flex-start;


}



.back {


font-size:22px;


cursor:pointer;


margin-bottom:40px;


}



.detail-title {


font-size:50px;


font-weight:900;


}



.video-image {


width:100%;


height:350px;


margin-top:40px;


background:#ddd;


border-radius:20px;


display:flex;


justify-content:center;


align-items:center;


font-size:80px;


}



.info {


margin-top:30px;


font-size:22px;


line-height:2;


}



.legend-title {


margin-top:70px;


font-size:40px;


}



.legend-box {


width:400px;


height:300px;


margin-top:30px;


background:#f5f5f5;


border-radius:20px;


display:flex;


justify-content:center;


align-items:center;


font-size:70px;


}



</style>


</head>



<body>



<!-- =========================
1페이지
========================= -->


<section class="page first-page">


<div class="logo">

보따 도감

</div>


<div class="arrow">

↓

</div>


</section>





<!-- =========================
2페이지
========================= -->


<section class="page second-page" id="archive">


<div class="title">

보따 영상 도감

</div>



<div class="video-list">



<div class="card" onclick="openDetail()">



<div class="thumbnail">

📷

</div>



<div class="card-text">

첫 번째 영상 제목

<br>

날짜

</div>



</div>




<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

두 번째 영상 제목

<br>

날짜

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

세 번째 영상 제목

<br>

날짜

</div>


</div>



</div>


</section>






<!-- =========================
3페이지 상세
========================= -->


<section class="page detail-page" id="detail">


<div class="back" onclick="backArchive()">

← 영상 목록

</div>



<div class="detail-title">

첫 번째 영상 제목

</div>



<div class="video-image">

📷

</div>



<div class="info">

업로드 날짜 : 2025.00.00

<br>

영상 링크 : 준비중

</div>



<div class="legend-title">

🔥 레전드 짤 도감

</div>



<div class="legend-box">

📸

</div>



</section>






<script>


function openDetail(){


document
.getElementById("detail")
.scrollIntoView();



}



function backArchive(){


document
.getElementById("archive")
.scrollIntoView();



}



</script>



</body>

</html>
