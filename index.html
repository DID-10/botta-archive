<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:sans-serif;
    overflow-x:hidden;
}


/* =========================
1페이지
========================= */

.home{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
    linear-gradient(
        135deg,
        #db4ea7,
        #e46fc2
    );

}


.logo{

    color:white;

    font-size:90px;

    font-weight:900;

    animation:
    float 3s infinite ease-in-out;

}


@keyframes float{

    50%{

        transform:translateY(-15px);

    }

}


.arrow{

    margin-top:100px;

    color:white;

    font-size:50px;

}



/* =========================
2페이지
========================= */


.archive{

    min-height:100vh;

    background:#fafafa;

    padding:60px;

}


.title{

    font-size:55px;

    font-weight:900;

    margin-bottom:50px;

}


.video-list{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:40px;

}


.card{

    height:280px;

    background:white;

    border-radius:20px;

    padding:20px;

    cursor:pointer;

    box-shadow:

    0 10px 30px rgba(0,0,0,0.1);

}


.thumbnail{

    height:160px;

    background:#ddd;

    border-radius:15px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:40px;

}


.card-text{

    margin-top:20px;

    font-size:20px;

}



/* =========================
상세 화면
========================= */


.detail{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100vw;

    height:100vh;

    background:white;

    z-index:10;

    padding:60px;

    overflow-y:auto;

}


.back{

    font-size:22px;

    cursor:pointer;

    margin-bottom:40px;

}


.detail-title{

    font-size:50px;

    font-weight:900;

}


.video-box{

    margin-top:40px;

    width:100%;

    height:350px;

    background:#ddd;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:80px;

}


.info{

    margin-top:30px;

    font-size:22px;

    line-height:2;

}


.legend-title{

    margin-top:70px;

    font-size:40px;

}


.legend-box{

    width:400px;

    height:300px;

    margin-top:30px;

    background:#f5f5f5;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:70px;

}


</style>

</head>


<body>


<!-- =========================
1페이지
========================= -->


<section class="home">


<div class="logo">

보따 도감

</div>


<div class="arrow">

↓

</div>


</section>



<!-- =========================
2페이지
========================= -->


<section class="archive" id="archive">


<div class="title">

보따 영상 도감

</div>



<div class="video-list">


<div class="card" onclick="openDetail()">


<div class="thumbnail">

📷

</div>


<div class="card-text">

첫 번째 영상 제목

<br>

날짜

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

두 번째 영상 제목

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

세 번째 영상 제목

</div>


</div>



</div>


</section>





<!-- =========================
상세 화면
========================= -->


<div class="detail" id="detail">


<div class="back" onclick="closeDetail()">

← 돌아가기

</div>



<div class="detail-title">

첫 번째 영상 제목

</div>



<div class="video-box">

📷

</div>



<div class="info">

업로드 날짜 : 2025.00.00

<br>

영상 링크 : 준비중

</div>



<div class="legend-title">

🔥 레전드 짤 도감

</div>



<div class="legend-box">

📸

</div>



</div>





<script>


// 새로고침 시 스크롤 위치 초기화

history.scrollRestoration = "manual";


window.onload = function(){

    window.scrollTo(0,0);

};



let scrollPosition = 0;



function openDetail(){


scrollPosition = window.scrollY;


document
.getElementById("detail")
.style.display="block";


}



function closeDetail(){


document
.getElementById("detail")
.style.display="none";


window.scrollTo(0,scrollPosition);


}


</script>



</body>

</html>
