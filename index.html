<!DOCTYPE html> <!-- HTML5 문서 시작 -->

<html lang="ko"> <!-- 웹페이지 전체 시작 -->


<head> <!-- 설정 영역 시작 -->


<meta charset="UTF-8">
<!-- 한글 깨짐 방지 -->


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 모바일 화면 대응 -->


<title>보따 도감</title>
<!-- 브라우저 탭 이름 -->


<style>

/* =========================
   기본 설정
========================= */


* {

  margin:0;
  /* 기본 여백 제거 */


  padding:0;
  /* 기본 안쪽 여백 제거 */


  box-sizing:border-box;
  /* 크기 계산 방식 */

}



body {

  overflow-x:hidden;
  /* 좌우 스크롤 제거 */


  overflow-y:auto;
  /* 휠 가능 */

}



/* =========================
   첫 번째 화면
========================= */


.page {


  height:100vh;
  /* 화면 한 장 크기 */


  display:flex;
  /* 정렬 */


  flex-direction:column;
  /* 위아래 배치 */


  justify-content:center;
  /* 세로 중앙 */


  align-items:center;
  /* 가로 중앙 */



  position:relative;
  /* 배경 기준 */



  overflow:hidden;
  /* 화면 밖 숨김 */



  background:

  radial-gradient(

    circle at center,

    #e46fc2 0%,
    /* 중심 밝은 핑크 */


    #db4ea7 25%,
    /* 중간 핑크 */


    #e46fc2 50%,
    /* 반복 */


    #db4ea7 75%,
    /* 반복 */


    #e46fc2 100%

  );



}



/* =========================
   제목
========================= */


.logo {


  position:relative;


  z-index:2;


  font-size:90px;


  font-weight:900;


  color:white;


  letter-spacing:-6px;



  text-shadow:

  0 10px 30px rgba(0,0,0,0.18);



}



/* =========================
   혀 전체
========================= */


.tongues {


  position:relative;


  z-index:2;


  width:100%;


  display:flex;


  justify-content:space-around;


  align-items:center;


  margin-top:80px;


}



/* =========================
   혀 하나
========================= */


.tongue {


  font-size:70px;


  display:block;


  animation:

  tongueStretch 0.1s infinite alternate;



}



/* =========================
   혀 위아래 변형
========================= */


@keyframes tongueStretch {


  from {


    transform:

    scaleY(0.15);



  }


  to {


    transform:

    scaleY(2.2);



  }



}



/* =========================
   아래 화살표
========================= */


.arrow {


  position:relative;


  z-index:2;


  margin-top:80px;


  font-size:50px;


  color:white;


}



/* =========================
   두 번째 화면
========================= */


.second-page {


  height:100vh;


  background:white;


}



</style>


</head>
<!-- 설정 끝 -->



<body>
<!-- 화면 표시 시작 -->



<section class="page">
<!-- 첫 번째 페이지 -->



<div class="logo">
보따 도감
</div>
<!-- 제목 -->



<div class="tongues">
<!-- 혀 공간 -->


<div class="tongue">👅</div>
<!-- 혀 -->


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


<div class="tongue">👅</div>


</div>



<div class="arrow">
↓
</div>
<!-- 아래 이동 표시 -->


</section>




<section class="second-page">
<!-- 두 번째 화면 -->

</section>



</body>
<!-- 화면 끝 -->


</html>
<!-- 문서 끝 -->
