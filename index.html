<!DOCTYPE html> <!-- HTML5 문서 시작 -->

<html lang="ko"> <!-- 웹페이지 전체 시작 -->


<head> <!-- 설정 영역 시작 -->


<meta charset="UTF-8">
<!-- 한글 표시 설정 -->


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 화면 크기 대응 -->


<title>보따 도감</title>
<!-- 브라우저 제목 -->



<style>

/* =========================
   기본 설정
========================= */


* {

  margin: 0;
  /* 기본 여백 제거 */

  padding: 0;
  /* 기본 안쪽 여백 제거 */

  box-sizing: border-box;
  /* 크기 계산 */

}



body {

  overflow-x: hidden;
  /* 가로 스크롤 제거 */

}



/* =========================
   첫 화면
========================= */


.page {

  height: 100vh;
  /* 화면 전체 높이 */


  display: flex;
  /* 정렬 사용 */


  flex-direction: column;
  /* 세로 배치 */


  justify-content: center;
  /* 세로 중앙 */


  align-items: center;
  /* 가로 중앙 */



  background:

  linear-gradient(
    135deg,

    #db4ea7,
    /* 진한 핑크 */

    #e46fc2
    /* 밝은 핑크 */

  );

}



/* =========================
   제목
========================= */


.logo {

  font-size: 90px;
  /* 글씨 크기 */


  font-weight: 900;
  /* 두꺼운 글씨 */


  color: white;
  /* 글씨 색 */


  letter-spacing: -6px;
  /* 글자 간격 */


  text-shadow:

  0 8px 25px rgba(0,0,0,0.15);
  /* 고급스러운 그림자 */

}



/* =========================
   혀 영역
========================= */


.tongues {

  display: flex;
  /* 가로 정렬 */


  gap: 25px;
  /* 혀 사이 간격 */


  margin-top: 80px;
  /* 제목과 거리 */

}



/* =========================
   혀 하나
========================= */


.tongue {

  font-size: 70px;
  /* 혀 크기 */


  display: block;


  animation:

  insaneLick 0.12s infinite alternate;
  /* 매우 빠른 움직임 */

}



/* =========================
   혀 위아래 변형
========================= */


@keyframes insaneLick {


  0% {


    transform:

    scaleY(0.35);
    /* 짧아짐 */

  }



  50% {


    transform:

    scaleY(1.8);
    /* 길어짐 */

  }



  100% {


    transform:

    scaleY(0.35);
    /* 다시 줄어듦 */

  }


}



/* =========================
   화살표
========================= */


.arrow {


  margin-top: 80px;
  /* 위치 */


  font-size: 45px;
  /* 크기 */


  color:white;
  /* 색 */


  opacity:0.8;

}



/* =========================
   두 번째 화면
========================= */


.second-page {

  height:100vh;
  /* 빈 화면 */

}



</style>


</head>
<!-- 설정 끝 -->



<body>
<!-- 화면 시작 -->



<section class="page">
<!-- 첫 번째 화면 -->


<div class="logo">
보따 도감
</div>
<!-- 사이트 이름 -->


<div class="tongues">
<!-- 혀 모음 -->


<div class="tongue">👅</div>
<!-- 혀 1 -->


<div class="tongue">👅</div>
<!-- 혀 2 -->


<div class="tongue">👅</div>
<!-- 혀 3 -->


<div class="tongue">👅</div>
<!-- 혀 4 -->


<div class="tongue">👅</div>
<!-- 혀 5 -->


</div>



<div class="arrow">
↓
</div>
<!-- 아래 이동 표시 -->


</section>



<section class="second-page">
<!-- 두 번째 페이지 -->

</section>



</body>
<!-- 화면 끝 -->


</html>
<!-- 문서 끝 -->
