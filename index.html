<!DOCTYPE html> <!-- HTML 문서 시작 -->

<html lang="ko"> <!-- 웹페이지 전체 시작 -->


<head> <!-- 설정 시작 -->

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>


<style>

/* =========================
   기본 설정
========================= */

* {

  margin:0;
  padding:0;
  box-sizing:border-box;

}


html {

  scroll-behavior:smooth;

}


body {

  overflow-x:hidden;
  overflow-y:auto;

}



/* =========================
   페이지 공통
========================= */


.page {

  width:100vw;
  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-direction:column;

}



/* =========================
   1페이지 배경
   여기 수정
========================= */


.first-page {

  background:

  linear-gradient(
    135deg,
    #db4ea7,
    #e46fc2
  );

}



/* =========================
   보따 도감 제목
   여기 수정
========================= */


.logo {

  font-size:90px;

  font-weight:900;

  color:white;

  letter-spacing:-5px;


  text-shadow:

  0 10px 30px rgba(0,0,0,0.15);


  animation:

  floatLogo 3s infinite ease-in-out;

}



/* 제목 움직임 */


@keyframes floatLogo {


  0% {

    transform:translateY(0);

  }


  50% {

    transform:translateY(-15px);

  }


  100% {

    transform:translateY(0);

  }


}



/* =========================
   아래 화살표
========================= */


.arrow {

  margin-top:100px;

  font-size:50px;

  color:white;


  animation:

  arrowMove 1.5s infinite;

}



@keyframes arrowMove {


  50% {

    transform:translateY(15px);

  }


}



/* =========================
   2페이지
========================= */


.second-page {


  background:#fafafa;

  padding:60px;

  justify-content:flex-start;

}



/* 2페이지 제목 */


.title {

  font-size:55px;

  font-weight:900;

  margin-bottom:50px;

}



/* =========================
   영상 카드 영역
========================= */


.video-list {


  width:100%;


  display:grid;


  grid-template-columns:

  repeat(2,1fr);


  gap:40px;


}



/* =========================
   영상 카드
   나중에 디자인 수정
========================= */


.card {


  height:280px;


  background:white;


  border-radius:20px;


  padding:20px;


  box-shadow:

  0 10px 30px rgba(0,0,0,0.1);


}



/* 썸네일 자리 */


.thumbnail {


  height:160px;


  background:#ddd;


  border-radius:15px;


  display:flex;


  justify-content:center;


  align-items:center;


  font-size:40px;


}



/* 카드 글 */


.card-text {


  margin-top:20px;


  font-size:20px;


}



</style>


</head>
<!-- 설정 끝 -->



<body>
<!-- 화면 시작 -->



<section class="page first-page">
<!-- 1페이지 -->


<div class="logo">

보따 도감

</div>


<div class="arrow">

↓

</div>


</section>




<section class="page second-page">
<!-- 2페이지 -->


<div class="title">

보따 영상 도감

</div>



<div class="video-list">



<div class="card">

<div class="thumbnail">

📷

</div>

<div class="card-text">

영상 제목<br>
날짜

</div>

</div>



<div class="card">

<div class="thumbnail">

📷

</div>

<div class="card-text">

영상 제목<br>
날짜

</div>

</div>



<div class="card">

<div class="thumbnail">

📷

</div>

<div class="card-text">

영상 제목<br>
날짜

</div>

</div>



<div class="card">

<div class="thumbnail">

📷

</div>

<div class="card-text">

영상 제목<br>
날짜

</div>

</div>



</div>


</section>



</body>
<!-- 화면 끝 -->


</html>
<!-- 웹페이지 끝 -->
