<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>


<style>


* {

margin:0;

padding:0;

box-sizing:border-box;

}



html {

scroll-behavior:smooth;

}



body {

font-family:sans-serif;

overflow-x:hidden;

}



/* =========================
페이지 공통
========================= */


.page {

width:100vw;

min-height:100vh;

display:flex;

flex-direction:column;

align-items:center;

}



/* =========================
1페이지
========================= */


.first-page {


height:100vh;


justify-content:center;


background:

linear-gradient(

135deg,

#db4ea7,

#e46fc2

);


}



.logo {


font-size:90px;


font-weight:900;


color:white;


animation:

float 3s infinite ease-in-out;


}



@keyframes float {


50% {


transform:translateY(-15px);


}


}



.arrow {


margin-top:100px;


font-size:50px;


color:white;


}



/* =========================
2페이지
========================= */


.archive {


background:#fafafa;


padding:60px;


justify-content:flex-start;


}



.title {


font-size:55px;


font-weight:900;


margin-bottom:50px;


}



.video-list {


width:100%;


display:grid;


grid-template-columns:repeat(2,1fr);


gap:40px;


}



.card {


height:280px;


background:white;


border-radius:20px;


padding:20px;


cursor:pointer;


box-shadow:

0 10px 30px rgba(0,0,0,0.1);


}



.thumbnail {


height:160px;


background:#ddd;


border-radius:15px;


display:flex;


justify-content:center;


align-items:center;


font-size:40px;


}



.card-text {


margin-top:20px;


font-size:20px;


}



/* =========================
상세 화면
========================= */


.detail {


display:none;


min-height:100vh;


background:white;


padding:60px;


}



.back {


font-size:22px;


cursor:pointer;


margin-bottom:40px;


}



.detail h1 {


font-size:50px;


}



.video {


height:350px;


margin-top:40px;


background:#ddd;


border-radius:20px;


display:flex;


justify-content:center;


align-items:center;


font-size:80px;


}



.info {


margin-top:30px;


font-size:22px;


line-height:2;


}



.legend {


margin-top:70px;


font-size:40px;


}



.legend-box {


width:400px;


height:300px;


margin-top:30px;


background:#f5f5f5;


border-radius:20px;


display:flex;


justify-content:center;


align-items:center;


font-size:70px;


}


</style>


</head>



<body>



<!-- =========================
1페이지
========================= -->


<section class="page first-page" id="home">


<div class="logo">

보따 도감

</div>


<div class="arrow">

↓

</div>


</section>





<!-- =========================
2페이지
========================= -->


<section class="page archive" id="archive">


<div class="title">

보따 영상 도감

</div>



<div class="video-list">



<div class="card" onclick="openDetail()">



<div class="thumbnail">

📷

</div>


<div class="card-text">

첫 번째 영상 제목

<br>

날짜

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

두 번째 영상 제목

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

세 번째 영상 제목

</div>


</div>



</div>


</section>






<!-- =========================
상세 페이지
========================= -->


<section class="detail" id="detail">



<div class="back" onclick="backArchive()">

← 돌아가기

</div>



<h1>

첫 번째 영상 제목

</h1>



<div class="video">

📷

</div>



<div class="info">

날짜 : 2025.00.00

<br>

영상 링크 : 준비중

</div>



<div class="legend">

🔥 레전드 짤 도감

</div>



<div class="legend-box">

📸

</div>



</section>






<script>


let archivePosition = 0;



function openDetail(){


/* 현재 2페이지 위치 저장 */


archivePosition = window.scrollY;



/* 상세 화면 표시 */


document.getElementById("archive").style.display="none";


document.getElementById("detail").style.display="block";



window.scrollTo(0,0);



}




function backArchive(){


/* 상세 숨기기 */


document.getElementById("detail").style.display="none";



/* 2페이지 다시 표시 */


document.getElementById("archive").style.display="flex";



/* 원래 위치 복귀 */


window.scrollTo(0,archivePosition);



}



</script>



</body>

</html>
