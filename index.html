<!DOCTYPE html> <!-- HTML5 문서 시작 -->

<html lang="ko"> <!-- 웹페이지 시작 -->


<head> <!-- 설정 영역 시작 -->


<meta charset="UTF-8">
<!-- 한글 설정 -->


<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 화면 대응 -->


<title>보따 도감</title>
<!-- 브라우저 제목 -->



<style>

/* =========================
   기본 설정
========================= */


* {

  margin:0;
  /* 기본 여백 제거 */


  padding:0;
  /* 기본 안쪽 여백 제거 */


  box-sizing:border-box;
  /* 크기 계산 */

}



body {

  overflow:hidden;
  /* 화면 밖 숨김 */

}



/* =========================
   첫 번째 페이지
========================= */


.page {


  height:100vh;
  /* 화면 전체 */


  display:flex;
  /* 정렬 */


  flex-direction:column;
  /* 세로 배치 */


  justify-content:center;
  /* 중앙 정렬 */


  align-items:center;
  /* 중앙 정렬 */



  position:relative;
  /* 배경 기준 */


  overflow:hidden;



  background:#db4ea7;
  /* 기본 색 */

}



/* =========================
   별 모양 배경
   중심에서 퍼지는 효과
========================= */


.page::before {


  content:"";
  /* 가상 배경 생성 */


  position:absolute;
  /* 화면 배치 */


  width:160%;
  height:160%;


  left:50%;
  top:50%;


  transform:
  translate(-50%,-50%);


  background:

  repeating-conic-gradient(

    from 0deg,

    #db4ea7 0deg 20deg,

    #e46fc2 20deg 40deg

  );


  clip-path:

  polygon(

  50% 0%,
  61% 35%,
  100% 35%,
  68% 57%,
  80% 100%,
  50% 75%,
  20% 100%,
  32% 57%,
  0% 35%,
  39% 35%

  );


  opacity:0.9;


}



/* =========================
   제목
========================= */


.logo {


  position:relative;
  /* 배경 위 표시 */


  z-index:2;


  font-size:90px;


  font-weight:900;


  color:white;


  letter-spacing:-6px;


  text-shadow:

  0 10px 30px rgba(0,0,0,0.2);


}



/* =========================
   혀 전체
========================= */


.tongues {


  position:relative;


  z-index:2;


  display:flex;


  width:100%;


  justify-content:space-around;


  margin-top:80px;


}



/* =========================
   혀 하나
========================= */


.tongue {


  font-size:65px;


  animation:

  tongueMove 0.08s infinite alternate;


}



/* =========================
   미친 속도 위아래 변화
========================= */


@keyframes tongueMove {


  from {


    transform:

    scaleY(0.2);


  }


  to {


    transform:

    scaleY(2);


  }


}



/* =========================
   화살표
========================= */


.arrow {


  position:relative;


  z-index:2;


  margin-top:80px;


  color:white;


  font-size:50px;


}



/* =========================
   두 번째 화면
========================= */


.second-page {


height:100vh;


}



</style>


</head>



<body>
<!-- 화면 표시 시작 -->



<section class="page">
<!-- 첫 화면 -->



<div class="logo">
보따 도감
</div>
<!-- 제목 -->



<div class="tongues">
<!-- 혀 공간 -->


<div class="tongue">👅</div>

<div class="tongue">👅</div>

<div class="tongue">👅</div>

<div class="tongue">👅</div>

<div class="tongue">👅</div>

<div class="tongue">👅</div>

<div class="tongue">👅</div>

<div class="tongue">👅</div>


</div>



<div class="arrow">
↓
</div>
<!-- 아래 이동 -->



</section>



<section class="second-page">

</section>



</body>


</html>
