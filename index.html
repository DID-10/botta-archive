<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{
    font-family:sans-serif;
    overflow-x:hidden;
}



/* =========================
1페이지
========================= */


.home{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
    linear-gradient(
        135deg,
        #db4ea7,
        #e46fc2
    );

}



.logo{

    color:white;

    font-size:90px;

    font-weight:900;

    animation:
    float 3s infinite ease-in-out;

}



@keyframes float{

    50%{
        transform:translateY(-15px);
    }

}



.arrow{

    margin-top:100px;

    color:white;

    font-size:50px;

}



/* =========================
2페이지
김원식 짤 도감
========================= */


.archive{

    min-height:100vh;

    background:#fafafa;

    padding:60px;

}



.title{

    font-size:55px;

    font-weight:900;

    margin-bottom:50px;

}



.jjal-list{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:40px;

}



.card{

    height:350px;

    background:white;

    border-radius:25px;

    padding:20px;

    cursor:pointer;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.1);

    transition:0.3s;

}



.card:hover{

    transform:translateY(-10px);

}



.jjal-image{

    height:220px;

    background:#ddd;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:70px;

}



.card-title{

    margin-top:20px;

    font-size:25px;

    font-weight:900;

}



.card-grade{

    margin-top:10px;

    font-size:20px;

}



/* =========================
상세 페이지
========================= */


.detail{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100vw;

    height:100vh;

    background:white;

    z-index:10;

    padding:60px;

    overflow-y:auto;

}



.back{

    font-size:22px;

    cursor:pointer;

    margin-bottom:40px;

}



.detail-title{

    font-size:55px;

    font-weight:900;

}



.detail-image{

    width:700px;

    height:450px;

    margin-top:40px;

    background:#ddd;

    border-radius:30px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:120px;

}



.detail-info{

    margin-top:40px;

    font-size:22px;

    line-height:2;

}



.attack{

    margin-top:50px;

    font-size:35px;

    font-weight:900;

}



.grade{

    margin-top:40px;

    font-size:30px;

}



</style>


</head>



<body>



<!-- =========================
1페이지
========================= -->


<section class="home">


<div class="logo">

보따 도감

</div>


<div class="arrow">

↓

</div>


</section>





<!-- =========================
2페이지
========================= -->


<section class="archive">



<div class="title">

김원식 짤 도감

</div>



<div class="jjal-list">



<div class="card" onclick="openDetail()">



<div class="jjal-image">

📸

</div>



<div class="card-title">

레전드 표정

</div>



<div class="card-grade">

D컵

</div>



</div>





<div class="card">


<div class="jjal-image">

📸

</div>


<div class="card-title">

웃참 실패

</div>


<div class="card-grade">

C컵

</div>


</div>






<div class="card">


<div class="jjal-image">

📸

</div>


<div class="card-title">

화난 김원식

</div>


<div class="card-grade">

B컵

</div>


</div>



</div>


</section>







<!-- =========================
짤 상세
========================= -->


<div class="detail" id="detail">



<div class="back" onclick="closeDetail()">

← 돌아가기

</div>



<div class="detail-title">

레전드 표정

</div>



<div class="detail-image">

📸

</div>



<div class="detail-info">


출처 영상:

준비중


<br>


등장 시간:

03:24


</div>




<div class="attack">

조지는 방법

</div>



<div class="detail-info">

- 표정으로 압박

<br>

- 타이밍 공격

<br>

- 반복 사용 가능

</div>



<div class="grade">

등급:

<br>

D컵

</div>



</div>






<script>


history.scrollRestoration="manual";


window.onload=function(){

    window.scrollTo(0,0);

};



let scrollPosition=0;



function openDetail(){

    scrollPosition=window.scrollY;

    document
    .getElementById("detail")
    .style.display="block";

}



function closeDetail(){

    document
    .getElementById("detail")
    .style.display="none";


    window.scrollTo(0,scrollPosition);

}


</script>



</body>

</html>
