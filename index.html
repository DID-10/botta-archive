<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow-x:hidden;
    font-family:sans-serif;
}


/* =========================
   1페이지
========================= */

.home{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
    linear-gradient(
        135deg,
        #db4ea7,
        #e46fc2
    );

}


.logo{

    color:white;

    font-size:90px;

    font-weight:900;

    animation:float 3s infinite ease-in-out;

}


.subtitle{

    margin-top:20px;

    color:white;

    font-size:30px;

    font-weight:700;

}


@keyframes float{

    50%{

        transform:translateY(-15px);

    }

}


.arrow{

    margin-top:100px;

    color:white;

    font-size:50px;

}



/* =========================
   2페이지
========================= */


.archive{

    min-height:100vh;

    padding:60px;

    background:#fafafa;

}



.title{

    font-size:55px;

    font-weight:900;

    margin-bottom:50px;

}



.card-list{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:40px;

}



.card{

    position:relative;

    background:white;

    border-radius:25px;

    padding:20px;

    cursor:pointer;

    box-shadow:
    0 10px 30px rgba(0,0,0,.1);

    transition:.3s;

}



.card:hover{

    transform:translateY(-10px);

}



.grade{

    position:absolute;

    top:20px;

    right:20px;

    background:#111;

    color:white;

    padding:8px 15px;

    border-radius:20px;

    font-weight:900;

}



.image{

    height:230px;

    border-radius:20px;

    overflow:hidden;

    background:#ddd;

}



.image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}



.name{

    margin-top:20px;

    font-size:25px;

    font-weight:900;

}
    /* =========================
   상세 페이지
========================= */


.detail{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100vw;

    height:100vh;

    background:white;

    z-index:100;

    padding:50px 70px;

    overflow-y:auto;

}



.back{

    cursor:pointer;

    font-size:22px;

    font-weight:bold;

    margin-bottom:40px;

}



.detail-box{

    display:flex;

    gap:70px;

    align-items:flex-start;

    max-width:1500px;

    margin:auto;

}



.detail-image{

    width:45%;

    aspect-ratio:4/3;

    background:#ddd;

    border-radius:30px;

    overflow:hidden;

    flex-shrink:0;

}



.detail-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}



.info{

    width:55%;

    font-size:24px;

    line-height:2.2;

    padding-bottom:80px;

}



.info h1{

    font-size:55px;

    margin-bottom:20px;

}



.skill{

    margin-top:40px;

    margin-bottom:15px;

    font-size:35px;

    font-weight:900;

}

</style>

</head>

<body>



<!-- =========================
1페이지
========================= -->


<section class="home">

<div class="logo">

보따 도감

</div>

<div class="subtitle">

김원식 짤 카드 도감

</div>

<div class="arrow">

↓

</div>

</section>



<!-- =========================
2페이지
========================= -->


<section class="archive">

<div class="title">

김원식 짤 카드 도감

</div>

<div class="card-list">
    
<!-- 첫 번째 카드 -->

<div class="card" onclick="openDetail()">

    <div class="grade">

        D컵

    </div>

    <div class="image">

      <img src="slime.jpg.png" alt="슬라임">

    </div>

    <div class="name">

        하루종일 머리에 슬라임 뿌려주기ㅋㅋㅋ

    </div>

</div>



<!-- 두 번째 카드 -->

<div class="card">

    <div class="grade">

        C컵

    </div>

    <div class="image">

        📸

    </div>

    <div class="name">

        웃참 실패

    </div>

</div>



<!-- 세 번째 카드 -->

<div class="card">

    <div class="grade">

        B컵

    </div>

    <div class="image">

        📸

    </div>

    <div class="name">

        화난 김원식

    </div>

</div>



</div>

</section>



<!-- =========================
상세 페이지
========================= -->

<div class="detail" id="detail">

<div class="back" onclick="closeDetail()">

← 돌아가기

</div>

<div class="detail-box">

<div class="detail-image">

<img src="images/slime.jpg" alt="슬라임">

</div>

<div class="info">

<h1>

하루종일 머리에 슬라임 뿌려주기ㅋㅋㅋ

</h1>

출처 영상

<br>

등장 시간

<br>

<div class="skill">

조지는 방법

</div>

- 표정 공격

<br>

- 타이밍 공격

<br>

- 한 번 더 압박

<br>

- 상대 멘탈 붕괴



<div class="skill">

등급

</div>

D컵

</div>

</div>

</div>



<script>

history.scrollRestoration="manual";

window.onload=function(){

    window.scrollTo(0,0);

}

let y=0;

function openDetail(){

    y=window.scrollY;

    document.getElementById("detail").style.display="block";

}

function closeDetail(){

    document.getElementById("detail").style.display="none";

    window.scrollTo(0,y);

}

</script>

</body>

</html>
```
