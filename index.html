<!DOCTYPE html> <!-- HTML5 문서 시작 -->

<html lang="ko"> <!-- 웹페이지 전체 시작 -->


<head> <!-- 설정 시작 -->


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>보따 도감</title>


<style>

/* =========================
   기본 설정
========================= */


* {

  margin:0;

  padding:0;

  box-sizing:border-box;

}



html {

  scroll-behavior:smooth;

}



body {

  overflow-x:hidden;

  font-family:sans-serif;

}



/* =========================
   페이지 공통
========================= */


.page {

  width:100vw;

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-direction:column;

}



/* =========================
   1페이지
========================= */


.first-page {

  background:

  linear-gradient(

  135deg,

  #db4ea7,

  #e46fc2

  );

}



.logo {

  font-size:90px;

  font-weight:900;

  color:white;

  animation:

  floatLogo 3s infinite ease-in-out;

}



@keyframes floatLogo {


0% {

transform:translateY(0);

}


50% {

transform:translateY(-15px);

}


100% {

transform:translateY(0);

}


}



.arrow {

  margin-top:100px;

  font-size:50px;

  color:white;

}



/* =========================
   2페이지 영상 목록
========================= */


.second-page {

  background:#fafafa;

  padding:60px;

  justify-content:flex-start;

}



.title {

  font-size:55px;

  font-weight:900;

  margin-bottom:50px;

}



.video-list {

  width:100%;

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:40px;

}



.card {

  height:280px;

  background:white;

  border-radius:20px;

  padding:20px;

  cursor:pointer;

  box-shadow:

  0 10px 30px rgba(0,0,0,0.1);

}



.thumbnail {

  height:160px;

  background:#ddd;

  border-radius:15px;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:40px;

}



.card-text {

  margin-top:20px;

  font-size:20px;

}



/* =========================
   3페이지 상세
========================= */


.detail-page {

  min-height:100vh;

  background:white;

  padding:60px;

  display:none;

}



.back {

  font-size:22px;

  cursor:pointer;

  margin-bottom:40px;

}



.detail-title {

  font-size:50px;

  font-weight:900;

}



.video-image {


  margin-top:40px;

  height:350px;

  background:#ddd;

  border-radius:20px;


  display:flex;

  justify-content:center;

  align-items:center;


  font-size:80px;


}



.info {

  margin-top:30px;

  font-size:22px;

  line-height:2;

}



.legend-title {


  margin-top:70px;

  font-size:40px;

}



.legend-card {


  margin-top:30px;

  width:400px;


  padding:20px;


  background:#f7f7f7;


  border-radius:20px;


}



.legend-image {


  height:250px;


  background:#ddd;


  border-radius:15px;


  display:flex;


  justify-content:center;


  align-items:center;


  font-size:70px;


}



</style>


</head>



<body>
<!-- 화면 시작 -->



<section class="page first-page">
<!-- 1페이지 -->


<div class="logo">

보따 도감

</div>


<div class="arrow">

↓

</div>


</section>





<section class="page second-page">
<!-- 2페이지 -->


<div class="title">

보따 영상 도감

</div>



<div class="video-list">



<div class="card" onclick="openVideo()">


<div class="thumbnail">

📷

</div>


<div class="card-text">

첫 번째 영상 제목

<br>

날짜

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>



<div class="card">


<div class="thumbnail">

📷

</div>


<div class="card-text">

영상 제목

<br>

날짜

</div>


</div>



</div>


</section>





<section class="detail-page" id="detail">
<!-- 3페이지 상세 -->


<div class="back" onclick="backList()">

← 목록으로

</div>



<div class="detail-title">

첫 번째 영상 제목

</div>



<div class="video-image">

📷

</div>



<div class="info">

업로드 날짜 : 2025.00.00

<br>

영상 링크 : 준비중

</div>



<div class="legend-title">

🔥 레전드 짤 도감

</div>



<div class="legend-card">


<div class="legend-image">

📸

</div>


<p>

시간 : 03:24

</p>


<p>

김원식 레전드 장면 설명

</p>


</div>



</section>





<script>


function openVideo(){


document.querySelector(".second-page").style.display="none";


document.querySelector(".detail-page").style.display="block";


window.scrollTo(0,0);


}



function backList(){


document.querySelector(".detail-page").style.display="none";


document.querySelector(".second-page").style.display="flex";


window.scrollTo(0,document.body.scrollHeight);


}



</script>



</body>


</html>
